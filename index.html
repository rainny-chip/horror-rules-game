let S;const app=document.getElementById('app');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(){S={at:'gate',visited:[],items:[],clues:[],flags:[],fear:0,steps:0};try{localStorage.setItem('horror13',JSON.stringify(S))}catch(e){};render()}
function save(){try{localStorage.setItem('horror13',JSON.stringify(S))}catch(e){}}
function has(k,v){return k==='item'?S.items.includes(v):k==='clue'?S.clues.includes(v):k==='clue2'?S.clues.includes(v):S.flags.includes(v)}
function can(req){return Object.entries(req||{}).every(([k,v])=>has(k,v))}
function act(c){const [label,to,req,effect]=c;if(!can(req))return;if(effect){for(const [k,v] of Object.entries(effect)){if(k==='item'&&!S.items.includes(v))S.items.push(v);if(k==='clue'&&!S.clues.includes(v))S.clues.push(v);if(k==='flag'&&!S.flags.includes(v))S.flags.push(v);if(k==='fear')S.fear+=v;if(k==='remove')S.items=S.items.filter(x=>x!==v)}}S.visited.push(S.at);S.at=to;S.steps++;save();render()}
function start(){app.innerHTML=`<div class="fade"><div class="eyebrow">INTERACTIVE PSYCHOLOGICAL HORROR</div><h1>ห้องเรียนที่สิบสาม</h1><p class="small">HORROR RULES · HARD 3.0 — COMPLETE STORY</p><div class="panel"><p>เวลา 18:13 น. คุณยังติดอยู่ในโรงเรียนที่ไม่มีใครควรอยู่หลังเลิกเรียน</p><p>ที่นี่มีกฎ แต่ไม่ใช่ทุกข้อความที่เห็นจะเชื่อได้ คุณต้องสังเกตหลักฐานและรับผลจากทุกการตัดสินใจ</p><div class="hr"></div><h2>กฎที่ได้รับก่อนเข้าอาคาร</h2><ol class="rules">${RULES.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="note">คำเตือน: อาจมีคนแก้ไขคู่มือ กฎในเอกสารนี้เป็นเพียงฉบับที่คุณได้รับ ไม่ใช่คำรับรองว่าทุกข้อถูกต้อง</p><button class="primary" id="go">ยอมรับความเสี่ยงและเริ่มเกม</button><button id="resume" class="hidden">เล่นต่อจากครั้งก่อน</button></div><p class="small">เกมแต่งขึ้นเพื่อความบันเทิง มีเนื้อหาสยองขวัญ · เล่นบนมือถือหรือคอม · เล่นซ้ำเพื่อค้นหาจุดจบอื่นได้</p></div>`;document.getElementById('go').onclick=fresh;let old;try{old=JSON.parse(localStorage.getItem('horror13'))}catch(e){}if(old&&old.at){let b=document.getElementById('resume');b.classList.remove('hidden');b.onclick=()=>{S=old;render()}}}
function render(){if(!S){start();return}if(ENDS[S.at])return ending();let n=NODES[S.at];if(!n){app.innerHTML='พบข้อผิดพลาดของเส้นเรื่อง';return}let [title,desc,choices]=n;let available=choices.filter(c=>can(c[2]));app.innerHTML=`<div class="fade"><div class="top"><span>18:13 · โรงเรียนวชิรเงา</span><span>การตัดสินใจ ${S.steps} ครั้ง · ความหวาดกลัว ${S.fear}</span></div><div class="eyebrow">THE THIRTEENTH CLASSROOM</div><h2>${esc(title)}</h2><div class="panel"><p>${esc(desc)}</p><div class="hr"></div><div class="small">คุณจะทำอย่างไร?</div><div id="choices"></div></div><div class="toolbar"><button id="rules">คู่มือกฎ</button><button id="bag">กระเป๋า / หลักฐาน</button><button id="restart">เริ่มใหม่</button></div><div class="small">ฉากที่ผ่านแล้ว ${new Set(S.visited).size+1} ฉาก · ทางเลือกบางข้อจะปรากฏเมื่อคุณมีหลักฐานหรือไอเทมที่ต้องใช้</div></div>`;let target=document.getElementById('choices');available.forEach(c=>{let b=document.createElement('button');b.textContent=c[0];b.onclick=()=>act(c);target.appendChild(b)});if(!available.length){let b=document.createElement('button');b.textContent='กลับไปสำรวจทางอื่น';b.onclick=()=>{S.at='stair';render()};target.appendChild(b)}document.getElementById('rules').onclick=()=>overlay('คู่มือกฎ',`<ol class="rules">${RULES.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="warning">อย่าเชื่อกฎโดยไม่ตรวจสอบหลักฐาน</p>`);document.getElementById('bag').onclick=()=>overlay('กระเป๋าและหลักฐาน',`<h3>สิ่งของ</h3><p>${S.items.length?S.items.map(esc).join(' · '):'ยังไม่มี'}</p><h3>ร่องรอยที่พบ</h3><p>${S.clues.length?S.clues.map(esc).join(' · '):'ยังไม่มี'}</p><p class="small">ชื่อหลักฐานแสดงแบบย่อ เพื่อไม่เฉลยคำตอบโดยตรง</p>`);document.getElementById('restart').onclick=()=>{if(confirm('เริ่มใหม่ทั้งหมดและลบความคืบหน้า?')){S=null;try{localStorage.removeItem('horror13')}catch(e){};start()}}}
function overlay(title,content){let original=app.innerHTML;app.innerHTML=`<div class="fade"><h2>${esc(title)}</h2><div class="panel">${content}<button id="back">กลับสู่เกม</button></div></div>`;document.getElementById('back').onclick=render}
function ending(){let [title,desc,type]=ENDS[S.at];let score=Math.max(0,Math.round(100+S.clues.length*8+S.items.length*4-S.fear*5));let result=`ห้องเรียนที่สิบสาม — ${type}\nตัดสินใจ ${S.steps} ครั้ง | หลักฐาน ${S.clues.length} ชิ้น | คะแนนสำรวจ ${score}\nคุณจะรอดจาก 18:13 ไหม?`;app.innerHTML=`<div class="fade"><div class="eyebrow">YOUR FATE HAS BEEN SEALED</div><h1>${esc(title)}</h1><div class="panel"><p>${esc(desc)}</p><div class="hr"></div><div class="pills"><span class="pill">${S.steps} การตัดสินใจ</span><span class="pill">${S.clues.length} หลักฐาน</span><span class="pill">${score} คะแนนสำรวจ</span></div><p class="small">มีจุดจบหลายแบบ การตัดสินใจและหลักฐานจะเปลี่ยนชะตาของคุณ คะแนนเป็นเพียงสถิติการสำรวจ ไม่ใช่ตัวชี้ว่าจบแบบดีที่สุด</p><button class="primary" id="share">คัดลอกผลไปแชร์ใน LINE</button><button id="again">เล่นใหม่เพื่อค้นหาจุดจบอื่น</button></div></div>`;document.getElementById('share').onclick=async()=>{try{await navigator.clipboard.writeText(result);alert('คัดลอกผลแล้ว นำไปวางใน LINE ได้เลย')}catch(e){prompt('คัดลอกข้อความนี้ไปแชร์',result)}};document.getElementById('again').onclick=()=>{S=null;try{localStorage.removeItem('horror13')}catch(e){};start()}}
start();</script></body></html>
